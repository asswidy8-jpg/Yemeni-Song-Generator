name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build APK
      run: |
        mkdir build
        cd app
        echo "Building YemeniSongGenerator..."
        zip -r ../build/YemeniSongGenerator.zip src

    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: YemeniSongGenerator
        path: build/YemeniSongGenerator.zip
